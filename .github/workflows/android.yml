name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# Las actions se fijan por SHA de commit (no por etiqueta, que se puede mover). Para actualizar:
# git ls-remote https://github.com/<repo> refs/tags/<versión>
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Tests, lint y APK de depuración
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Subir APK de depuración
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mis2fa-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
