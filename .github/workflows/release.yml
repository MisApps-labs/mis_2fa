name: Release

on:
  push:
    tags: [ 'v*' ]

# Las actions se fijan por SHA de commit (no por etiqueta, que se puede mover). Para actualizar:
# git ls-remote https://github.com/<repo> refs/tags/<versión>
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Preparar almacén de claves
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "MIS2FA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secret KEYSTORE_BASE64: el APK se publicará sin firmar."
          fi

      - name: Tests y APK release
        env:
          MIS2FA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MIS2FA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MIS2FA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/Mis2FA-${GITHUB_REF_NAME}$( [[ "$f" == *unsigned* ]] && echo -unsigned ).apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Crear release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
